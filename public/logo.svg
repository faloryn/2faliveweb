<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shield-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Shield Inner Fill -->
    <linearGradient id="shield-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Lightning Accent -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Background Cyber Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12" opacity="0.3" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.2" />

  <!-- Shield Base (Security / 2FA) -->
  <path d="M 256 95 
           C 345 95 385 130 385 220 
           C 385 325 295 390 256 415 
           C 217 390 127 325 127 220 
           C 127 130 167 95 256 95 Z" 
        fill="url(#shield-fill)" 
        stroke="url(#shield-stroke)" 
        stroke-width="10" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Center Keyhole / Authenticator Pulse Arc -->
  <path d="M 195 245 A 65 65 0 1 1 317 245" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-dasharray="14 10" />

  <!-- Stylized "2" and Padlock / Key Shackle -->
  <!-- Bold 2FA Number 2 Overlay -->
  <path d="M 225 185 
           C 225 160 287 160 287 195 
           C 287 225 225 250 225 285 
           L 292 285" 
        fill="none" 
        stroke="url(#neon-glow)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Pulse Status Dot -->
  <circle cx="256" cy="335" r="12" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="335" r="6" fill="#ffffff" />
</svg>
